name: deploy
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/adr/**'
      - 'docs/phase3/**'
      - 'docs/architecture.md'
      - 'docs/deploy.md'
      - 'docs/postmortem-phase3.md'
      - 'README.md'
      - 'LICENSE'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run smoke
      - name: Commit refreshed docs/ build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "no build changes to publish"
            exit 0
          fi
          git commit -m "chore: publish pages build"
          git push
